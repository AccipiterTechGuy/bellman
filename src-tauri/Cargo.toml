[package]
# Package name must differ from the CLI sidecar binary name (`bellman`).
# The installed GUI binary is therefore `bellman-app`; the AI-skill CLI stays
# `bellman` (see bundle.externalBin + scripts/stage_cli_sidecar.sh).
name = "bellman-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bellman — task scheduler desktop shell (Tauri v2)"
publish = false
default-run = "bellman-app"

[lib]
name = "bellman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bellman-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bellman-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
log = "0.4"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# and the built-in dev server is disabled. DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
