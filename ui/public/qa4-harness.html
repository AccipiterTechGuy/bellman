<!doctype html>
<!--
  QA P4 headless harness — pages 1-4 + create/edit dialog

  Usage:
      # 1. Build bundle
      cd ui && npm run build
      # 2. Run a static server rooted at ui/dist
      python3 -m http.server 8765 --directory dist &
      # 3. Capture each page via Google Chrome headless
      chrome --headless --disable-gpu --no-sandbox --window-size=1280,720 \
            --hide-scrollbars --virtual-time-budget=2000 \
            --screenshot=$PWD/docs/qa4-screenshots/all-timers.png \
            http://127.0.0.1:8765/qa4-harness.html#all

  Visible URLs (use --window-size + fragment):
      qa4-harness.html#all       All timers table
      qa4-harness.html#week      Week page (7-col DOW grid)
      qa4-harness.html#month     Month page (6×7 calendar)
      qa4-harness.html#history   Run history (filtered JSONL tail)
      qa4-harness.html#dialog    TimerDialog open with gap-time preview

  The harness installs `window.__TAURI_INTERNALS__` (Tauri IPC mock),
  `window.__TAURI__` (withGlobalTauri gate), and a set of timers/events
  designed to populate every page. `api.js` routes every command through
  this mock when present.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bellman — QA P4 harness</title>
    <link rel="stylesheet" href="assets/index-qfZ1aaNE.css" />
    <style>
      body { background: #14181d; color: #e6edf3; margin: 0; }
      .nav { padding: 8px 14px; font: 13px system-ui; color: #8a96a3; border-bottom: 1px solid #2d343c; background: #1c2127; }
      .nav a { color: #4ec9b0; margin-right: 14px; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="nav">
      <a href="#all">All timers</a>
      <a href="#week">Week</a>
      <a href="#month">Month</a>
      <a href="#history">Run history</a>
      <a href="#dialog">Dialog</a>
    </div>
    <div id="app"></div>

    <script>
      (function () {
        function isoDaysAgo(days, hh, mm) {
          const d = new Date(Date.now() - days * 86400000);
          d.setHours(hh, mm, 0, 0);
          return d.toISOString();
        }
        const idWeekly = "11111111-1111-1111-1111-111111111111";
        const idDaily = "22222222-2222-2222-2222-222222222222";
        const idInterval = "33333333-3333-3333-3333-333333333333";
        const idMonthly31 = "44444444-4444-4444-4444-444444444444";
        const idYearlyFeb29 = "55555555-5555-5555-5555-555555555555";
        const idOnce = "66666666-6666-6666-6666-666666666666";

        const fixtures = {
          list_timers: async () => [
            {
              id: idWeekly, name: "morning-sync", enabled: true,
              tz: "Europe/Helsinki", nextFireUtc: isoDaysAgo(0, 8, 0),
              lastFired: isoDaysAgo(1, 8, 0),
              kind: "weekly", summary: "weekly Mon,Wed,Fri 08:00:00 Europe/Helsinki",
              action: "notify: morning-sync",
              occurrence: { occ: "weekly", tz: "Europe/Helsinki",
                days: { mon: true, wed: true, fri: true }, at: "08:00:00" },
              actionKind: { type: "notify", title: "morning-sync", body: "" },
              revision: 1,
            },
            {
              id: idDaily, name: "drink-water", enabled: true, tz: "UTC",
              nextFireUtc: isoDaysAgo(0, 12, 0), lastFired: null,
              kind: "daily", summary: "daily 12:00:00 UTC",
              action: "notify: drink-water",
              occurrence: { occ: "daily", tz: "UTC", at: "12:00:00" },
              actionKind: { type: "notify", title: "drink-water", body: "💧" },
              revision: 1,
            },
            {
              id: idInterval, name: "tick", enabled: true, tz: "UTC",
              nextFireUtc: isoDaysAgo(0, 9, 0), lastFired: null,
              kind: "interval (5s)", summary: "every 5s",
              action: "none",
              occurrence: { occ: "interval", tz: "UTC", everySecs: 5,
                anchor: isoDaysAgo(0, 9, 0) },
              actionKind: { type: "none" },
              revision: 1,
            },
            {
              id: idMonthly31, name: "monthly-bill", enabled: true,
              tz: "Europe/Helsinki", nextFireUtc: "2026-07-31T12:00:00Z",
              lastFired: null,
              kind: "monthly", summary: "monthly day 31 12:00:00 Europe/Helsinki",
              action: "launch: /usr/bin/notify-send",
              occurrence: { occ: "monthly", tz: "Europe/Helsinki",
                day: 31, at: "12:00:00" },
              actionKind: { type: "launch", command: "/usr/bin/notify-send",
                args: ["monthly-bill due"], workdir: null },
              revision: 1,
            },
            {
              id: idYearlyFeb29, name: "leap-day", enabled: true,
              tz: "UTC", nextFireUtc: "2028-02-29T09:00:00Z",
              lastFired: null,
              kind: "yearly", summary: "yearly 2-29 09:00:00 UTC",
              action: "none",
              occurrence: { occ: "yearly", tz: "UTC", month: 2, day: 29,
                at: "09:00:00" },
              actionKind: { type: "none" },
              revision: 1,
            },
            {
              id: idOnce, name: "qa-gap-once", enabled: true,
              tz: "Europe/Helsinki",
              nextFireUtc: "2027-03-28T03:30:00Z", lastFired: null,
              kind: "once", summary: "once 2027-03-28T03:30:00 Europe/Helsinki",
              action: "none",
              occurrence: { occ: "once", tz: "Europe/Helsinki",
                at: "2027-03-28T03:30:00" },
              actionKind: { type: "none" },
              revision: 1,
            },
          ],
          get_timer: async (args) => {
            const list = await fixtures.list_timers();
            return list.find((t) => t.id === args.id) ?? list[0];
          },
          set_enabled: async (args) =>
            (await fixtures.list_timers()).find((t) => t.id === args.id),
          run_now: async (args) => {
            const t = (await fixtures.list_timers()).find((t) => t.id === args.id);
            return {
              timerId: t.id, name: t.name,
              runId: "99999999-9999-9999-9999-999999999999",
              scheduledFor: new Date().toISOString(),
              message: "fired (harness)",
              enabled: t.enabled, nextFireUtc: t.nextFireUtc,
            };
          },
          list_log_tail: async () => ({
            events: [
              { event_id: "e1", ts: isoDaysAgo(0, 8, 1), kind: "fired",
                timer_id: idWeekly, timer_name: "morning-sync",
                run_id: "r1", scheduled_for: isoDaysAgo(0, 8, 0),
                duration_ms: 12, message: "ok" },
              { event_id: "e2", ts: isoDaysAgo(1, 8, 0), kind: "registered",
                timer_id: idDaily, timer_name: "drink-water",
                message: "via QA harness" },
              { event_id: "e3", ts: isoDaysAgo(2, 12, 0), kind: "fired_late",
                timer_id: idMonthly31, timer_name: "monthly-bill",
                duration_ms: 4321, message: "grace 60" },
              { event_id: "e4", ts: isoDaysAgo(7, 9, 0), kind: "wake_delivered",
                timer_id: idInterval, timer_name: "tick", message: "wake ok" },
              { event_id: "e5", ts: isoDaysAgo(30, 8, 0), kind: "year_recalibrate",
                message: "Jan-1 pass" },
            ],
            totalRecords: 5, skipped: 0,
          }),
          get_pause_all: async () => false,
          set_pause_all: async (args) => args.paused,
          create_timer: async (args) => ({ ...(await fixtures.list_timers())[0], name: args.input.name }),
          update_timer: async (args) => (await fixtures.list_timers()).find((t) => t.id === args.id),
          delete_timer: async () => true,
          preview_fires: async (args) => {
            const kind = args.input.kind;
            const time = args.input.time || "12:00:00";
            const tz = args.input.tz || "UTC";
            const base = new Date();
            base.setSeconds(0, 0);
            const fires = [];
            for (let i = 1; i <= (args.n ?? 5); i++) {
              const utc = new Date(base.getTime() + i * 86400000);
              fires.push({
                utc: utc.toISOString(),
                localDate: utc.toISOString().slice(0, 10),
                localTime: time,
                offset: tz === "UTC" ? "UTC" : "+00:00",
                tzName: tz,
              });
            }
            const warnings = [];
            if (
              kind === "once" && tz === "Europe/Helsinki"
              && /03:30/.test(args.input.onceAt || "")
            ) {
              warnings.push(
                "this once-at time in this timezone do not exist; the schedule will resolve to the first valid instant after the requested time."
              );
            }
            return { fires, warnings };
          },
          wizard_status: async () => ({ completed: true, defaults: { autostart: true, startMinimized: false, wakeEnabled: false } }),
          wizard_set_choice: async (args) => ({ completed: true, defaults: args.choice }),
          wizard_re_run: async () => ({ completed: false, defaults: { autostart: true, startMinimized: false, wakeEnabled: false } }),
          app_info: async () => ({
            dataDir: "/home/sami/.bellman",
            dbPath: "/home/sami/.bellman/timers.db",
            logsDir: "/home/sami/.bellman/logs",
            slotsDir: "/home/sami/.bellman/slots",
            wizardCompleted: true,
            autostartEnabled: true,
            pauseAll: false,
          }),
        };

        const callbacks = new Map();
        const invokes = [];
        let nextCbId = 1;
        const internals = {
          invoke: async (cmd, args) => {
            invokes.push({ cmd, args });
            if (Object.prototype.hasOwnProperty.call(fixtures, cmd)) {
              return await fixtures[cmd](args);
            }
            return null;
          },
          transformCallback: (cb) => {
            const id = nextCbId++;
            callbacks.set(id, cb);
            return id;
          },
          unregisterCallback: (id) => callbacks.delete(id),
          runCallback: (id, payload) => {
            const fn = callbacks.get(id);
            if (!fn) return false;
            try { fn(payload); } catch (e) { console.error("[harness]", e); }
            return true;
          },
        };
        window.__TAURI_INTERNALS__ = internals;
        window.__TAURI__ = {
          event: {
            listen: async (_event, _handler) => {
              return async () => {};
            },
          },
        };
        window.__bellman_fixtures__ = fixtures;
        // Also expose the harness.js for tests.
        window.__bellman_harness__ = { fixtures, invokes };
      })();
    </script>

    <script type="module" crossorigin src="assets/index-BZL7jwSu.js"></script>
    <script>
      // After the bundle mounts, route the hash to the right tab so each
      // screenshot has the intended page loaded. The App.svelte $state
      // binds the URL hash on mount.
      (function () {
        function readTab() {
          const h = (location.hash || "").replace(/^#/, "");
          if (["all", "week", "month", "history"].includes(h)) return h;
          return "all";
        }
        const target = readTab();
        document.addEventListener("DOMContentLoaded", () => {
          // Wait one tick so Svelte has registered listeners; if the hash
          // has not been honored we dispatch a click on the matching tab.
          setTimeout(() => {
            const link = Array.from(document.querySelectorAll(".tab"))
              .find((b) => b.textContent.trim().toLowerCase().startsWith(
                target === "all" ? "all"
                  : target === "week" ? "week"
                  : target === "month" ? "month"
                  : "run history"
              ));
            if (link && !link.classList.contains("active")) link.click();
            // For dialog screenshot: open the new-timer dialog by clicking
            // the "+ New timer" button so the preview pane is visible.
            if (location.hash === "#dialog") {
              const btn = Array.from(document.querySelectorAll("button"))
                .find((b) => /new timer/i.test(b.textContent || ""));
              if (btn) btn.click();
              // Then set Helsinki + 03:30 in the tz field to show the
              // DST gap banner.
              setTimeout(() => {
                const tzInput = document.getElementById("td-tz");
                if (tzInput) {
                  tzInput.value = "Europe/Helsinki";
                  tzInput.dispatchEvent(new Event("input", { bubbles: true }));
                }
                const onceAt = document.getElementById("td-once");
                if (onceAt) {
                  onceAt.value = "2027-03-28T03:30:00";
                  onceAt.dispatchEvent(new Event("input", { bubbles: true }));
                }
                // Force kind to "once".
                const kindSelect = document.getElementById("td-kind");
                if (kindSelect) {
                  kindSelect.value = "once";
                  kindSelect.dispatchEvent(new Event("change", { bubbles: true }));
                }
              }, 200);
            }
          }, 50);
        });
      })();
    </script>
  </body>
</html>
