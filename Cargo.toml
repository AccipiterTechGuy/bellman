[workspace]
resolver = "2"
members = [
    "crates/bellman-core",
    "crates/bellman-cli",
    "src-tauri",
]
# Standalone macOS helper — built with its own [workspace] under helpers/.
exclude = ["helpers/macos-wake-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bellman-core = { path = "crates/bellman-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
croner = "2"
notify = "8"
notify-debouncer-full = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
rustix = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
zbus = { version = "5", features = ["blocking-api"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
