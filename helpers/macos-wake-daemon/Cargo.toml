# Standalone package (excluded from the bellman workspace root).
[workspace]

[package]
name = "bellman-macos-wake-daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bellman SMAppService root daemon — IOPMSchedulePowerEvent one-shots"
publish = false

[[bin]]
name = "bellman-wake-daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
